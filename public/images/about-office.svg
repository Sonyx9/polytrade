<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b3cde8"/>
      <stop offset="100%" stop-color="#d6e8f7"/>
    </linearGradient>
    <linearGradient id="bld" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Cobblestone road hint (Prague old town) -->
  <rect x="0" y="480" width="800" height="120" fill="#9e9e9e" opacity="0.5"/>
  <g opacity="0.3">
    <rect x="0" y="485" width="30" height="15" rx="2" fill="#757575"/>
    <rect x="35" y="490" width="25" height="12" rx="2" fill="#616161"/>
    <rect x="65" y="484" width="32" height="15" rx="2" fill="#757575"/>
    <rect x="102" y="489" width="28" height="13" rx="2" fill="#616161"/>
    <rect x="135" y="483" width="30" height="14" rx="2" fill="#757575"/>
  </g>

  <!-- Building (classic Prague style) -->
  <!-- Main facade -->
  <rect x="100" y="160" width="600" height="325" fill="url(#bld)"/>
  <!-- Roof detail / pediment -->
  <polygon points="100,160 400,80 700,160" fill="#bdbdbd"/>
  <polygon points="250,160 400,110 550,160" fill="#e0e0e0"/>

  <!-- Windows rows -->
  <g fill="#5c8fc2" opacity="0.85">
    <!-- Row 1 -->
    <rect x="155" y="200" width="70" height="90" rx="4"/>
    <rect x="265" y="200" width="70" height="90" rx="4"/>
    <rect x="365" y="200" width="70" height="90" rx="4"/>
    <rect x="465" y="200" width="70" height="90" rx="4"/>
    <rect x="575" y="200" width="70" height="90" rx="4"/>
    <!-- Row 2 -->
    <rect x="155" y="320" width="70" height="80" rx="4"/>
    <rect x="265" y="320" width="70" height="80" rx="4"/>
    <rect x="465" y="320" width="70" height="80" rx="4"/>
    <rect x="575" y="320" width="70" height="80" rx="4"/>
  </g>
  <!-- Window reflections -->
  <g fill="white" opacity="0.3">
    <rect x="160" y="205" width="20" height="35" rx="2"/>
    <rect x="270" y="205" width="20" height="35" rx="2"/>
    <rect x="370" y="205" width="20" height="35" rx="2"/>
    <rect x="470" y="205" width="20" height="35" rx="2"/>
    <rect x="580" y="205" width="20" height="35" rx="2"/>
    <rect x="160" y="325" width="20" height="30" rx="2"/>
    <rect x="270" y="325" width="20" height="30" rx="2"/>
    <rect x="470" y="325" width="20" height="30" rx="2"/>
    <rect x="580" y="325" width="20" height="30" rx="2"/>
  </g>

  <!-- Main door -->
  <rect x="340" y="390" width="120" height="95" rx="6" fill="#4e342e"/>
  <path d="M340 420 Q400 400 460 420" stroke="#c8a97e" stroke-width="3" fill="none"/>
  <circle cx="400" cy="440" r="6" fill="#c8a97e"/>

  <!-- Company sign above door -->
  <rect x="305" y="370" width="190" height="30" rx="4" fill="#1a1a2e"/>
  <text x="400" y="390" text-anchor="middle" fill="#c8a97e" font-family="serif" font-size="13" font-weight="bold">PL POLYTRADE s.r.o.</text>

  <!-- Flag on top -->
  <line x1="400" y1="40" x2="400" y2="85" stroke="#9e9e9e" stroke-width="3"/>
  <path d="M400 40 L440 52 L400 65Z" fill="#d32f2f"/>
  <path d="M400 40 L400 53 L440 52Z" fill="#1565c0"/>

  <!-- Street lamp -->
  <line x1="90" y1="300" x2="90" y2="490" stroke="#616161" stroke-width="6"/>
  <path d="M90 300 Q110 280 130 290" stroke="#616161" stroke-width="4" fill="none"/>
  <circle cx="130" cy="292" r="10" fill="#fff9c4" opacity="0.9"/>

  <!-- Clouds -->
  <ellipse cx="150" cy="100" rx="60" ry="25" fill="white" opacity="0.7"/>
  <ellipse cx="120" cy="100" rx="40" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="185" cy="105" rx="45" ry="18" fill="white" opacity="0.7"/>
  <ellipse cx="620" cy="120" rx="55" ry="22" fill="white" opacity="0.6"/>
  <ellipse cx="650" cy="118" rx="40" ry="18" fill="white" opacity="0.6"/>
</svg>
