<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="nightsky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2d2d4e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#ff6f00" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <!-- Night sky -->
  <rect width="600" height="400" fill="url(#nightsky)"/>
  <!-- Glow effect from grill -->
  <rect width="600" height="400" fill="url(#glow)"/>

  <!-- Stars -->
  <circle cx="80" cy="40" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="160" cy="70" r="1" fill="white" opacity="0.6"/>
  <circle cx="500" cy="30" r="2" fill="white" opacity="0.8"/>
  <circle cx="550" cy="80" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="30" cy="120" r="1" fill="white" opacity="0.6"/>
  <circle cx="420" cy="60" r="1.5" fill="white" opacity="0.7"/>

  <!-- Grill body -->
  <ellipse cx="300" cy="240" rx="130" ry="20" fill="#212121"/>
  <path d="M170 240 Q175 290 185 310 L415 310 Q425 290 430 240Z" fill="#424242"/>
  <!-- Grill lid -->
  <path d="M170 240 Q200 170 300 165 Q400 170 430 240Z" fill="#616161"/>
  <!-- Grill ventilation lines -->
  <path d="M190 230 Q300 185 410 230" stroke="#757575" stroke-width="2" fill="none"/>
  <path d="M195 220 Q300 180 405 220" stroke="#757575" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Grill grate -->
  <g opacity="0.5">
    <line x1="215" y1="242" x2="215" y2="250" stroke="#9e9e9e" stroke-width="2"/>
    <line x1="240" y1="242" x2="240" y2="250" stroke="#9e9e9e" stroke-width="2"/>
    <line x1="265" y1="242" x2="265" y2="250" stroke="#9e9e9e" stroke-width="2"/>
    <line x1="290" y1="242" x2="290" y2="250" stroke="#9e9e9e" stroke-width="2"/>
    <line x1="315" y1="242" x2="315" y2="250" stroke="#9e9e9e" stroke-width="2"/>
    <line x1="340" y1="242" x2="340" y2="250" stroke="#9e9e9e" stroke-width="2"/>
    <line x1="365" y1="242" x2="365" y2="250" stroke="#9e9e9e" stroke-width="2"/>
    <line x1="385" y1="242" x2="385" y2="250" stroke="#9e9e9e" stroke-width="2"/>
  </g>

  <!-- Legs -->
  <line x1="230" y1="310" x2="210" y2="390" stroke="#424242" stroke-width="10" stroke-linecap="round"/>
  <line x1="370" y1="310" x2="390" y2="390" stroke="#424242" stroke-width="10" stroke-linecap="round"/>
  <line x1="300" y1="310" x2="300" y2="385" stroke="#424242" stroke-width="10" stroke-linecap="round"/>

  <!-- Flames -->
  <g opacity="0.9">
    <path d="M250 240 C240 210 255 195 250 175 C265 195 270 180 265 160 C280 185 285 200 275 220 C285 205 290 185 285 165 C300 190 300 210 295 240Z" fill="#ff6f00"/>
    <path d="M295 240 C290 215 300 200 295 182 C308 200 312 188 308 170 C320 192 322 208 316 235Z" fill="#ff8f00"/>
    <path d="M318 240 C314 218 322 205 318 190 C330 207 333 195 330 178 C340 197 342 213 336 240Z" fill="#ffa000"/>
    <!-- Flame tips (brighter) -->
    <path d="M260 185 C258 175 263 165 260 155 C268 170 270 162 268 152 C276 165 275 175 272 190Z" fill="#ffcc02" opacity="0.8"/>
    <path d="M302 175 C300 167 305 158 302 150 C308 163 310 156 308 147 C315 159 314 168 311 180Z" fill="#ffcc02" opacity="0.7"/>
  </g>

  <!-- Tongs tool -->
  <g transform="translate(470, 220) rotate(25)">
    <rect x="-3" y="-80" width="6" height="100" rx="3" fill="#9e9e9e"/>
    <rect x="-3" y="-80" width="6" height="100" rx="3" fill="#9e9e9e" transform="rotate(15, 0, 20)"/>
    <rect x="-10" y="-85" width="20" height="12" rx="4" fill="#e0e0e0"/>
  </g>

  <!-- Brand label -->
  <rect x="20" y="340" width="185" height="44" rx="8" fill="#3e1a00" opacity="0.9"/>
  <text x="112" y="358" text-anchor="middle" fill="#ffb300" font-family="serif" font-size="11" font-weight="bold">GRILL &amp; HOBBY</text>
  <text x="112" y="374" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" opacity="0.7">grillandhobby.com</text>
</svg>
