<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dde3f8"/>
      <stop offset="100%" stop-color="#b8c4f0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Subtle fabric texture pattern -->
  <pattern id="fabric" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 0 10 L 20 10 M 10 0 L 10 20" stroke="#7a8fd8" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="600" height="400" fill="url(#fabric)"/>

  <!-- Large scissors illustration -->
  <g transform="translate(300, 200)">
    <!-- Handle 1 -->
    <ellipse cx="-60" cy="-100" rx="30" ry="55" fill="none" stroke="#1a1a2e" stroke-width="8" stroke-linecap="round"/>
    <!-- Handle 2 -->
    <ellipse cx="60" cy="100" rx="30" ry="55" fill="none" stroke="#1a1a2e" stroke-width="8" stroke-linecap="round"/>
    <!-- Blade 1 -->
    <path d="M-35 -60 L 90 30" stroke="#4f6ef2" stroke-width="10" stroke-linecap="round"/>
    <!-- Blade 2 -->
    <path d="M35 60 L -90 -30" stroke="#3657e0" stroke-width="10" stroke-linecap="round"/>
    <!-- Pivot -->
    <circle cx="0" cy="0" r="14" fill="#1a1a2e"/>
    <circle cx="0" cy="0" r="6" fill="#c8a97e"/>
    <!-- Tips -->
    <path d="M 90 30 L 110 36 L 98 22 Z" fill="#4f6ef2"/>
    <path d="M -90 -30 L -110 -36 L -98 -22 Z" fill="#3657e0"/>
  </g>

  <!-- Brand label -->
  <rect x="20" y="340" width="180" height="44" rx="8" fill="#1a1a2e" opacity="0.85"/>
  <text x="110" y="358" text-anchor="middle" fill="#c8a97e" font-family="serif" font-size="11" font-weight="bold">PROFINŮŽKY</text>
  <text x="110" y="374" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" opacity="0.7">profinuzky.cz</text>
</svg>
