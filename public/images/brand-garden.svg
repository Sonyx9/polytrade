<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#6d4c41"/>
    </linearGradient>
  </defs>
  <!-- Sky background -->
  <rect width="600" height="400" fill="url(#sky)"/>
  <!-- Ground strip -->
  <rect x="0" y="310" width="600" height="90" fill="url(#ground)"/>

  <!-- Sun -->
  <circle cx="520" cy="70" r="45" fill="#fff9c4" opacity="0.9"/>
  <circle cx="520" cy="70" r="32" fill="#fff176"/>

  <!-- Tree 1 (big) -->
  <rect x="195" y="220" width="18" height="95" fill="#5d4037" rx="4"/>
  <ellipse cx="204" cy="180" rx="70" ry="80" fill="#2e7d32"/>
  <ellipse cx="204" cy="175" rx="55" ry="65" fill="#388e3c"/>

  <!-- Tree 2 (small) -->
  <rect x="395" y="255" width="12" height="60" fill="#5d4037" rx="3"/>
  <ellipse cx="401" cy="220" rx="48" ry="55" fill="#388e3c"/>
  <ellipse cx="401" cy="215" rx="38" ry="45" fill="#43a047"/>

  <!-- Flowers -->
  <circle cx="100" cy="305" r="12" fill="#f06292"/>
  <circle cx="125" cy="300" r="9" fill="#f48fb1"/>
  <circle cx="80" cy="300" r="8" fill="#e91e63"/>
  <line x1="100" y1="305" x2="100" y2="315" stroke="#2e7d32" stroke-width="3"/>
  <line x1="125" y1="300" x2="125" y2="312" stroke="#2e7d32" stroke-width="2"/>
  <line x1="80" y1="300" x2="80" y2="310" stroke="#2e7d32" stroke-width="2"/>

  <!-- Trowel tool -->
  <g transform="translate(460, 260) rotate(-30)">
    <rect x="-6" y="-60" width="12" height="70" rx="4" fill="#795548"/>
    <path d="M-10 10 Q0 50 10 10 Z" fill="#9e9e9e"/>
    <rect x="-3" y="-75" width="6" height="20" rx="2" fill="#bdbdbd"/>
  </g>

  <!-- Brand label -->
  <rect x="20" y="340" width="190" height="44" rx="8" fill="#1a3a1a" opacity="0.85"/>
  <text x="115" y="358" text-anchor="middle" fill="#a5d6a7" font-family="serif" font-size="11" font-weight="bold">GARDEN &amp; HOBBY</text>
  <text x="115" y="374" text-anchor="middle" fill="white" font-family="sans-serif" font-size="9" opacity="0.7">gardenandhobby.com</text>
</svg>
