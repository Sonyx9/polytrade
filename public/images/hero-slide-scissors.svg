<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1628"/>
      <stop offset="100%" stop-color="#1c2a50"/>
    </linearGradient>
    <radialGradient id="glow" cx="65%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#4f6ef2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>

  <!-- Fabric texture lines -->
  <g opacity="0.06" stroke="white" stroke-width="1">
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="750" x2="1440" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="450" y1="0" x2="450" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
    <line x1="950" y1="0" x2="950" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
  </g>

  <!-- Large decorative scissors -->
  <g transform="translate(960, 450) rotate(-35)" opacity="0.18">
    <!-- Handle top -->
    <ellipse cx="-80" cy="-170" rx="55" ry="120" fill="none" stroke="#7b97f5" stroke-width="22"/>
    <!-- Handle bottom -->
    <ellipse cx="80" cy="170" rx="55" ry="120" fill="none" stroke="#7b97f5" stroke-width="22"/>
    <!-- Blades -->
    <line x1="-30" y1="-80" x2="200" y2="100" stroke="#c8a97e" stroke-width="28" stroke-linecap="round"/>
    <line x1="30" y1="80" x2="-200" y2="-100" stroke="#afc5ff" stroke-width="28" stroke-linecap="round"/>
    <!-- Pivot -->
    <circle cx="0" cy="0" r="30" fill="#1c2a50" stroke="#c8a97e" stroke-width="8"/>
    <circle cx="0" cy="0" r="10" fill="#c8a97e"/>
  </g>

  <!-- Smaller scissors echoing -->
  <g transform="translate(1250, 200) rotate(15)" opacity="0.08">
    <ellipse cx="-40" cy="-80" rx="28" ry="60" fill="none" stroke="#c8a97e" stroke-width="12"/>
    <ellipse cx="40" cy="80" rx="28" ry="60" fill="none" stroke="#c8a97e" stroke-width="12"/>
    <line x1="-15" y1="-40" x2="100" y2="50" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <line x1="15" y1="40" x2="-100" y2="-50" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="16" fill="#1c2a50" stroke="#c8a97e" stroke-width="5"/>
  </g>

  <!-- Dots / measurement marks -->
  <g fill="#c8a97e" opacity="0.3">
    <circle cx="400" cy="200" r="3"/>
    <circle cx="500" cy="150" r="2"/>
    <circle cx="350" cy="300" r="4"/>
    <circle cx="600" cy="250" r="2"/>
    <circle cx="700" cy="180" r="3"/>
  </g>

  <!-- Subtle vignette at bottom -->
  <rect x="0" y="600" width="1440" height="300" fill="url(#vignette)" opacity="0.6"/>
  <defs>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
  </defs>
</svg>
