<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1f0f"/>
      <stop offset="60%" stop-color="#1a3a22"/>
      <stop offset="100%" stop-color="#0d2410"/>
    </linearGradient>
    <radialGradient id="sun" cx="75%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#sky)"/>
  <rect width="1440" height="900" fill="url(#sun)"/>

  <!-- Ground -->
  <ellipse cx="720" cy="950" rx="900" ry="300" fill="#0a1e0d" opacity="0.8"/>

  <!-- Large tree left -->
  <rect x="280" y="380" width="30" height="400" fill="#2d4a1e" rx="8"/>
  <ellipse cx="295" cy="330" rx="160" ry="200" fill="#1a3a10"/>
  <ellipse cx="295" cy="300" rx="130" ry="170" fill="#2d5a1e"/>
  <ellipse cx="295" cy="275" rx="100" ry="140" fill="#3a7a28"/>

  <!-- Large tree right -->
  <rect x="1100" y="450" width="24" height="360" fill="#2d4a1e" rx="6"/>
  <ellipse cx="1112" cy="400" rx="130" ry="160" fill="#1e4214"/>
  <ellipse cx="1112" cy="375" rx="105" ry="130" fill="#2d6020"/>
  <ellipse cx="1112" cy="355" rx="80" ry="105" fill="#3a8028"/>

  <!-- Medium tree center-right -->
  <rect x="850" y="500" width="18" height="300" fill="#2a4018" rx="5"/>
  <ellipse cx="859" cy="450" rx="95" ry="115" fill="#1e4010"/>
  <ellipse cx="859" cy="430" rx="75" ry="92" fill="#326a22"/>

  <!-- Grass patches -->
  <g fill="#2a6018" opacity="0.6">
    <ellipse cx="200" cy="820" rx="120" ry="30"/>
    <ellipse cx="700" cy="850" rx="200" ry="25"/>
    <ellipse cx="1200" cy="830" rx="150" ry="28"/>
  </g>

  <!-- Flowers scattered -->
  <g>
    <circle cx="180" cy="760" r="10" fill="#f06292"/>
    <circle cx="200" cy="750" r="8" fill="#e91e63"/>
    <circle cx="160" cy="755" r="7" fill="#f48fb1"/>
    <circle cx="450" cy="790" r="9" fill="#ffeb3b"/>
    <circle cx="470" cy="780" r="7" fill="#fdd835"/>
    <circle cx="1300" cy="770" r="10" fill="#f06292"/>
    <circle cx="1320" cy="760" r="8" fill="#e91e63"/>
  </g>
  <g stroke="#2d6010" stroke-width="2" fill="none">
    <line x1="180" y1="760" x2="180" y2="785"/>
    <line x1="200" y1="750" x2="200" y2="778"/>
    <line x1="450" y1="790" x2="450" y2="810"/>
    <line x1="470" y1="780" x2="470" y2="800"/>
  </g>

  <!-- Stars / fireflies -->
  <g fill="white" opacity="0.4">
    <circle cx="600" cy="80" r="1.5"/>
    <circle cx="800" cy="50" r="1"/>
    <circle cx="1000" cy="90" r="2"/>
    <circle cx="400" cy="60" r="1.5"/>
    <circle cx="1200" cy="70" r="1"/>
    <circle cx="650" cy="140" r="1"/>
    <circle cx="900" cy="120" r="1.5"/>
  </g>

  <!-- Vignette bottom -->
  <rect x="0" y="550" width="1440" height="350" fill="url(#vig)"/>
  <defs>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#060e06"/>
    </linearGradient>
  </defs>
</svg>
