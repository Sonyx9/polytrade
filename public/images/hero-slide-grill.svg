<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <radialGradient id="nightbg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0f0a"/>
      <stop offset="100%" stop-color="#080508"/>
    </radialGradient>
    <radialGradient id="fireglow" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#ff6f00" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#bf360c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#nightbg)"/>
  <rect width="1440" height="900" fill="url(#fireglow)"/>

  <!-- Stars -->
  <g fill="white">
    <circle cx="100" cy="60" r="1.5" opacity="0.8"/>
    <circle cx="250" cy="40" r="1" opacity="0.6"/>
    <circle cx="400" cy="80" r="2" opacity="0.9"/>
    <circle cx="600" cy="30" r="1.5" opacity="0.7"/>
    <circle cx="750" cy="70" r="1" opacity="0.5"/>
    <circle cx="900" cy="45" r="1.5" opacity="0.8"/>
    <circle cx="1050" cy="65" r="1" opacity="0.6"/>
    <circle cx="1200" cy="35" r="2" opacity="0.9"/>
    <circle cx="1380" cy="55" r="1.5" opacity="0.7"/>
    <circle cx="180" cy="130" r="1" opacity="0.5"/>
    <circle cx="500" cy="110" r="1.5" opacity="0.6"/>
    <circle cx="800" cy="140" r="1" opacity="0.7"/>
    <circle cx="1100" cy="120" r="2" opacity="0.5"/>
    <circle cx="1350" cy="100" r="1" opacity="0.8"/>
  </g>

  <!-- Large BBQ grill -->
  <g transform="translate(720, 490)">
    <!-- Kettle body -->
    <path d="M-240 0 Q-250 100 -200 140 L200 140 Q250 100 240 0 Z" fill="#2a1a10"/>
    <path d="M-240 0 Q-250 100 -200 140 L200 140 Q250 100 240 0 Z" fill="url(#grillShade)" opacity="0.5"/>
    <!-- Lid -->
    <path d="M-240 0 Q-180 -180 0 -190 Q180 -180 240 0 Z" fill="#3a2010"/>
    <path d="M-220 -5 Q-170 -170 0 -178 Q170 -170 220 -5 Z" fill="#4a2818" opacity="0.6"/>
    <!-- Ventilation slits on lid -->
    <g stroke="#1a0f08" stroke-width="3" opacity="0.6">
      <path d="M-80 -140 Q0 -160 80 -140"/>
      <path d="M-100 -110 Q0 -130 100 -110"/>
    </g>
    <!-- Grill rim -->
    <ellipse cx="0" cy="0" rx="242" ry="22" fill="#1a0e08"/>
    <ellipse cx="0" cy="0" rx="230" ry="18" fill="#3a2010"/>
    <!-- Legs -->
    <line x1="-140" y1="140" x2="-180" y2="360" stroke="#2a1a10" stroke-width="20" stroke-linecap="round"/>
    <line x1="140" y1="140" x2="180" y2="360" stroke="#2a1a10" stroke-width="20" stroke-linecap="round"/>
    <line x1="0" y1="150" x2="0" y2="355" stroke="#2a1a10" stroke-width="16" stroke-linecap="round"/>
    <!-- Cross bar -->
    <line x1="-175" y1="280" x2="175" y2="280" stroke="#2a1a10" stroke-width="14" stroke-linecap="round"/>
    <!-- Bottom shelf -->
    <ellipse cx="0" cy="355" rx="185" ry="15" fill="#1e0e06" opacity="0.6"/>
  </g>

  <!-- Flames erupting from grill -->
  <g transform="translate(720, 300)" opacity="0.92">
    <!-- Main flame -->
    <path d="M0 190 C-80 140 -60 80 0 20 C30 60 70 40 50 -20 C90 30 100 80 70 140 C110 100 105 50 90 10 C130 60 135 120 110 170 Z" fill="#ff6f00"/>
    <path d="M-50 190 C-110 150 -90 90 -50 40 C-30 75 10 55 -10 0 C20 45 30 95 10 145 Z" fill="#ff8f00"/>
    <path d="M50 190 C110 155 95 95 55 45 C75 80 110 65 95 10 C125 60 130 115 105 165 Z" fill="#e64a19"/>
    <!-- Inner bright flames -->
    <path d="M0 180 C-40 150 -30 110 0 70 C20 95 45 80 30 45 C60 80 65 120 40 160 Z" fill="#ffcc02"/>
    <path d="M-20 175 C-55 148 -45 115 -20 80 C-5 102 18 92 8 62 C30 90 35 125 20 158 Z" fill="#fff176" opacity="0.7"/>
  </g>

  <!-- Smoke wisps -->
  <g opacity="0.12" fill="none" stroke="white" stroke-width="8" stroke-linecap="round">
    <path d="M700 200 Q680 150 700 100 Q720 50 700 0"/>
    <path d="M740 210 Q760 155 745 105 Q730 55 750 5"/>
    <path d="M720 195 Q700 140 715 90 Q730 40 715 -10"/>
  </g>

  <!-- Tongs -->
  <g transform="translate(1020, 300) rotate(20)">
    <rect x="-6" y="-120" width="12" height="150" rx="5" fill="#9e9e9e"/>
    <rect x="-6" y="-120" width="12" height="150" rx="5" fill="#9e9e9e" transform="rotate(18, 0, 30)"/>
    <ellipse cx="0" cy="-130" rx="18" ry="14" fill="#bdbdbd"/>
    <path d="M-12 30 L-20 55 L-8 55 L0 35Z" fill="#e0e0e0"/>
    <path d="M12 30 L20 55 L8 55 L0 35Z" fill="#e0e0e0"/>
  </g>

  <!-- Vignette -->
  <rect x="0" y="500" width="1440" height="400" fill="url(#vig)"/>
  <defs>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#050208"/>
    </linearGradient>
    <linearGradient id="grillShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="black" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>
