<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <radialGradient id="rg1" cx="60%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2d3561"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1440" height="900" fill="url(#rg1)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>

  <!-- Decorative abstract shapes representing the three brand domains -->
  <!-- Scissors shape (craft) -->
  <g transform="translate(950, 200) rotate(-20)" opacity="0.15">
    <ellipse cx="0" cy="-80" rx="18" ry="80" fill="none" stroke="#c8a97e" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="0" cy="80" rx="18" ry="80" fill="none" stroke="#c8a97e" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#c8a97e" opacity="0.6"/>
  </g>

  <!-- Leaf shape (garden) -->
  <g transform="translate(1100, 400)" opacity="0.12">
    <path d="M0 0 C40 -120 120 -80 80 0 C120 80 40 120 0 0Z" fill="#3d9e6e"/>
    <line x1="0" y1="0" x2="40" y2="-40" stroke="#3d9e6e" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- Flame shape (grill) -->
  <g transform="translate(1250, 300)" opacity="0.12">
    <path d="M0 100 C-60 60 -40 0 0 -60 C20 0 60 20 40 60 C80 20 60 -40 20 -100 C80 -60 120 20 80 80 C100 40 80 0 60 20 C60 60 40 80 0 100Z" fill="#e05c2e"/>
  </g>

  <!-- Subtle circles -->
  <circle cx="800" cy="150" r="300" fill="none" stroke="#c8a97e" stroke-width="1" opacity="0.05"/>
  <circle cx="800" cy="150" r="200" fill="none" stroke="#c8a97e" stroke-width="1" opacity="0.08"/>

  <!-- Light beam effect -->
  <path d="M0 900 L600 0 L700 0 L100 900Z" fill="white" opacity="0.02"/>
  <path d="M0 900 L400 0 L500 0 L50 900Z" fill="white" opacity="0.02"/>
</svg>
